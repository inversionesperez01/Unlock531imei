<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Core Terminal v4.8</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #000;
            color: #00ff66;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        #terminal {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 13px;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .log-line {
            margin-bottom: 4px;
            color: #00ff66;
        }

        .log-dim {
            color: #008833;
        }

        .log-warn {
            color: #ffb86c;
        }

        .log-error {
            color: #ff5555;
        }

        .log-highlight {
            color: #8be9fd;
            font-weight: bold;
        }

        .input-line {
            display: flex;
            align-items: center;
            margin-top: 5px;
        }

        .prompt-symbol {
            color: #00ff66;
            margin-right: 8px;
            font-weight: bold;
        }

        input {
            background: transparent;
            border: none;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            outline: none;
            width: 100%;
            caret-color: #00ff66;
        }

        #terminal::-webkit-scrollbar {
            width: 5px;
        }
        #terminal::-webkit-scrollbar-thumb {
            background: #003311;
        }
    </style>
</head>
<body>

    <div id="terminal">
        <div id="output">
            <div class="log-dim">SECURE CORE KERNEL [Version 4.8.19-ARCH]</div>
            <div class="log-dim">(c) 2026 Advanced Baseband Bypass Systems. All rights reserved.</div>
            <br>
            <div class="log-line">> SYSTEM READY. ENCRYPTED TUNNEL ACTIVE.</div>
            <div class="log-line log-warn">> ENTER TARGET IMEI TO INITIALIZE EXPLOIT:</div>
        </div>
        
        <div class="input-line" id="input-container">
            <span class="prompt-symbol">root@core:~#</span>
            <input type="text" id="terminal-input" autofocus autocomplete="off" autocapitalize="none" spellcheck="false">
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const output = document.getElementById('output');
        const input = document.getElementById('terminal-input');
        const inputContainer = document.getElementById('input-container');

        let state = 1; // 1: IMEI, 2: User1, 3: User2, 4: Confirm, 5: Loading
        let targetImei = "";

        function scrollToBottom() {
            terminal.scrollTop = terminal.scrollHeight;
        }

        function appendLog(text, className = "log-line") {
            const div = document.createElement('div');
            div.className = className;
            div.innerHTML = text;
            output.appendChild(div);
            scrollToBottom();
        }

        function runSequence(logs, callback) {
            inputContainer.style.display = 'none';
            let i = 0;
            const interval = setInterval(() => {
                if (i < logs.length) {
                    appendLog(logs[i], "log-dim");
                    i++;
                } else {
                    clearInterval(interval);
                    inputContainer.style.display = 'flex';
                    input.focus();
                    if (callback) callback();
                }
            }, 180);
        }

        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                const val = input.value.trim();
                if (!val && state !== 5) return;

                if (state !== 5) {
                    appendLog(`<span style="color:#8be9fd">root@core:~#</span> ${val}`);
                }
                input.value = "";

                handleState(val);
            }
        });

        function handleState(val) {
            switch(state) {
                case 1: // IMEI
                    if (val.length < 5) {
                        appendLog("> ERROR: INVALID IMEI LENGTH.", "log-error");
                        return;
                    }
                    targetImei = val;
                    state = 2;
                    
                    const seq1 = [
                        `> CONNECTING TO BASEBAND IMEI: ${targetImei}...`,
                        "> BYPASSING SECURITY PATCH...",
                        "> EXTRACTING BOOTLOADER CERTIFICATES...",
                        "> ALLOCATING MEMORY BUFFERS...",
                        "<br>",
                        "<span class='log-warn'>>> AUTHENTICATION REQUIRED: ENTER USERNAME:</span>"
                    ];
                    runSequence(seq1);
                    break;

                case 2: // Usuario: Unlocked_33a_Inversionesperez
                    if (val === "Unlocked_33a_Inversionesperez") {
                        state = 3;
                        appendLog("> USER VERIFIED SUCCESSFULLY.", "log-highlight");
                        appendLog("> ACCESS GRANTED TO SECURE PORT 8080.", "log-dim");
                        setTimeout(() => {
                            appendLog("<span class='log-warn'>>> ENTER ACCESS TOKEN:</span>", "log-line");
                        }, 300);
                    } else {
                        appendLog("> ACCESS DENIED: INVALID CREDENTIALS.", "log-error");
                        appendLog("<span class='log-warn'>>> RETRY USERNAME:</span>");
                    }
                    break;

                case 3: // Token: Unlocked-phone_531[unlock]
                    if (val === "Unlocked-phone_531[unlock]") {
                        state = 4;
                        appendLog("> TOKEN ACCEPTED. DECRYPTING CONTAINER...", "log-highlight");
                        appendLog("> WARNING: MODEL OVERRIDE PENDING.", "log-warn");
                        setTimeout(() => {
                            appendLog("<span class='log-warn'>>> CONFIRM MODEL AND ACTIVATION CODES (_ye$_531):</span>");
                        }, 300);
                    } else {
                        appendLog("> ERROR: INVALID TOKEN SIGNATURE.", "log-error");
                        appendLog("<span class='log-warn'>>> RETRY TOKEN:</span>");
                    }
                    break;

                case 4: // Confirmación: _ye$_531
                    if (val === "_ye$_531") {
                        state = 5;
                        inputContainer.style.display = 'none';
                        
                        const seqFinal = [
                            "> AUTHORIZATION ACCEPTED.",
                            "> INJECTING EXPLOIT PAYLOAD INTO DEVICE PARTITION...",
                            "> FLASHING SECURE FIRMWARE MOD...",
                            "> SYNCHRONIZING GLOBAL SERVER QUEUE...",
                            "<br>",
                            "<span class='log-highlight'>>> STATUS: QUEUED SUCCESSFULLY.</span>",
                            "<span class='log-warn'>>> ESTIMATED COMPLETION TIME: 6 DAYS. PLEASE DO NOT DISCONNECT.</span>",
                            "<br>",
                            "<span class='log-dim'>[PROCESS RUNNING IN BACKGROUND...]</span>"
                        ];
                        
                        let j = 0;
                        const finalInterval = setInterval(() => {
                            if (j < seqFinal.length) {
                                appendLog(seqFinal[j], "log-line");
                                j++;
                            } else {
                                clearInterval(finalInterval);
                            }
                        }, 350);

                    } else {
                        appendLog("> ERROR: CONFIRMATION HASH MISMATCH.", "log-error");
                        appendLog("<span class='log-warn'>>> RETRY CONFIRM CODE (_ye$_531):</span>");
                    }
                    break;
            }
        }
    </script>
</body>
</html>
